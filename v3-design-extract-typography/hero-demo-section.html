<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero demo — Denisa Dragomir</title>
  <meta name="description" content="Full-bleed hero demo with Livigno trail imagery and design system typography." />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="denisa-dragomir-variables.css" />
  <link rel="stylesheet" href="denisa-dragomir-typography.css" />
  <link rel="stylesheet" href="denisa-dragomir-components.css" />
  <style>
    * { box-sizing: border-box; margin: 0; }

    body {
      font-family: var(--font-body);
      background: var(--color-coal);
      color: var(--color-text-on-dark);
    }

    .hero-demo {
      position: relative;
      min-height: 100svh;
      min-height: 100vh;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .hero-demo__media {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .hero-demo__media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 58% center;
      filter: contrast(1.05) saturate(0.92);
    }

    .hero-demo__scrim {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(
          108deg,
          rgba(13, 13, 11, 0.82) 0%,
          rgba(13, 13, 11, 0.52) 38%,
          rgba(13, 13, 11, 0.18) 62%,
          transparent 88%
        ),
        linear-gradient(to top, rgba(13, 13, 11, 0.5) 0%, transparent 48%);
      pointer-events: none;
    }

    .hero-demo__inner {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: var(--content-max-width);
      margin-inline: auto;
      padding: calc(var(--header-height, 4rem) + var(--space-8)) var(--space-section-x) var(--space-section-y);
    }

    .hero-demo__content {
      max-width: 34rem;
    }

    .hero-demo .text-overline.on-dark {
      color: var(--color-burnt-orange);
      margin-bottom: var(--space-4);
    }

    .hero-demo__heading {
      margin-bottom: var(--space-3);
    }

    .hero-demo__heading-line {
      display: block;
      margin-bottom: var(--space-6);
    }

    .hero-demo__heading-line .ds-gold-underline--wide {
      width: min(18rem, 88%);
      height: 1.75rem;
    }

    .hero-demo__quote {
      margin-top: var(--space-2);
    }

    @media (min-width: 48rem) {
      .hero-demo__content {
        max-width: 38rem;
      }

      .hero-demo__media img {
        object-position: 62% center;
      }
    }

    @media (min-width: 64rem) {
      .hero-demo__inner {
        padding-top: calc(var(--header-height, 4.5rem) + var(--space-12));
      }

      .hero-demo__content {
        max-width: 42rem;
      }
    }

    .hero-demo-texture {
      background-color: var(--color-basalt);
      background-image:
        radial-gradient(circle at 1px 1px,
          rgba(255, 255, 255, 0.04) 1px,
          transparent 0);
      background-size: 24px 24px;
      padding-block: var(--space-section-y);
    }

    .hero-demo-texture__layout {
      display: grid;
      gap: var(--space-8);
      align-items: center;
    }

    .hero-demo-texture__polaroid {
      justify-self: center;
      width: 100%;
      max-width: 17.5rem;
    }

    .hero-demo-texture__polaroid img {
      object-position: 72% 38%;
    }

    @media (min-width: 48rem) {
      .hero-demo-texture__layout {
        grid-template-columns: 1fr minmax(11rem, 17.5rem);
        gap: var(--space-gutter);
      }

      .hero-demo-texture__polaroid {
        justify-self: end;
      }
    }

    @media (min-width: 64rem) {
      .hero-demo-texture__layout {
        gap: var(--space-12);
      }
    }

  </style>
</head>
<body class="on-dark">
  <svg class="ds-svg-defs" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <defs>
      <linearGradient id="ds-gold-line-fade" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="var(--color-gold)"></stop>
        <stop offset="70%" stop-color="var(--color-gold)"></stop>
        <stop offset="100%" stop-color="var(--color-gold)" stop-opacity="0"></stop>
      </linearGradient>
      <symbol id="ds-gold-line-shape" viewBox="0 0 420 28">
        <path fill="url(#ds-gold-line-fade)" d="M0 13.2C75 10.8 165 9.6 210 10.2C285 10.6 355 12.4 420 15.2L420 16C355 15.1 285 14.3 210 14.5C165 15.2 75 16.3 0 18.4Z"></path>
      </symbol>
    </defs>
  </svg>

  <section class="hero-demo" aria-labelledby="hero-demo-heading">
    <div class="hero-demo__media" aria-hidden="true">
      <img
        src="../livigno2.jpg"
        alt=""
        width="1920"
        height="1280"
        loading="eager"
        fetchpriority="high"
        decoding="async"
      />
      <div class="hero-demo__scrim"></div>
    </div>

    <div class="hero-demo__inner">
      <div class="hero-demo__content">
        <p class="text-overline on-dark">Livigno Skymarathon · Mountain endurance</p>

        <h1 id="hero-demo-heading" class="text-display-hero on-dark hero-demo__heading">
          Run Mountains.<br />
          Be More You.
        </h1>

        <span class="hero-demo__heading-line ds-gold-underline ds-gold-underline--wide" aria-hidden="true">
          <svg viewBox="0 0 420 28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <use href="#ds-gold-line-shape"></use>
          </svg>
        </span>

        <div class="ds-gold-line ds-gold-line--handwritten hero-demo__quote">
          <p class="text-handwritten--gold-line on-dark">
            The mountains are where I feel most alive.
          </p>
          <span class="ds-gold-underline" aria-hidden="true">
            <svg viewBox="0 0 420 28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <use href="#ds-gold-line-shape"></use>
            </svg>
          </span>
        </div>
      </div>
    </div>
  </section>

  <section class="hero-demo-texture on-dark" aria-label="Content">
    <div class="ds-container hero-demo-texture__layout">
      <div class="hero-demo-texture__copy">
        <p class="text-overline on-dark" style="color: var(--color-stone); margin-bottom: var(--space-3);">Trail coaching</p>
        <h2 class="text-display-lg on-dark" style="margin-bottom: var(--space-4);">Build endurance where it matters</h2>
        <p class="text-body-lg on-dark text-inverse-muted prose">
          Personalized mountain and trail running plans — weekly delivery, constant adjustment, and a community that runs together.
        </p>
      </div>

      <figure class="polaroid polaroid--cobalt hero-demo-texture__polaroid">
        <img
          src="../livigno2.jpg"
          alt="Denisa Dragomir trail running at Livigno Skymarathon"
          width="280"
          height="350"
          loading="lazy"
          decoding="async"
        />
        <figcaption>
          <p>Livigno ridge, 3,000m. <span class="script">pe vârf!</span></p>
        </figcaption>
      </figure>
    </div>
  </section>
</body>
</html>
